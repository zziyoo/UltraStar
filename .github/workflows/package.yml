name: 手动打包

on:
  workflow_dispatch:
    inputs:
      package_type:
        description: "打包类型"
        required: true
        type: choice
        default: "完整包"
        options:
          - 完整包
          - 增补包
      version:
        description: "完整包：选择版本（默认最新版）"
        required: true
        type: choice
        default: "最新版"
        options:
          # <VERSION_OPTIONS>
          - 最新版
          - v2.1.0
          # </VERSION_OPTIONS>
      old_version:
        description: "增补包：旧版本（默认上一版）"
        required: true
        type: choice
        default: "上一版"
        options:
          # <OLD_VERSION_OPTIONS>
          - 上一版
          - v2.1.0
          # </OLD_VERSION_OPTIONS>
      new_version:
        description: "增补包：新版本（默认最新版）"
        required: true
        type: choice
        default: "最新版"
        options:
          # <NEW_VERSION_OPTIONS>
          - 最新版
          - v2.1.0
          # </NEW_VERSION_OPTIONS>

permissions:
  contents: write

jobs:
  package:
    name: 打包
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库（完整历史）
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 获取全部版本 Tag
        run: |
          git fetch --tags --force --prune
          echo "当前可用的版本 Tag："
          git tag --list 'v*' --sort=-v:refname | head -20

      - name: 安装 Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      # 打包脚本内部完成：版本解析与校验（相同版本/反向版本直接报错终止）、
      # git diff 计算增补文件、zip 内容与预期集合的逐文件比对、Summary 输出
      - name: 执行打包
        env:
          PKG_TYPE: ${{ inputs.package_type }}
          PKG_VERSION: ${{ inputs.version }}
          PKG_OLD: ${{ inputs.old_version }}
          PKG_NEW: ${{ inputs.new_version }}
        run: |
          node tools/package/package.mjs \
            --type "$PKG_TYPE" \
            --version "$PKG_VERSION" \
            --old "$PKG_OLD" \
            --new "$PKG_NEW" \
            --out-dir dist

      # 用当前 Tag 列表刷新本 workflow 的版本下拉选项（无变化时自动跳过）
      - name: 刷新版本下拉选项
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node tools/package/refresh-choices.mjs

      - name: 发布到 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.release_tag }}
          name: ${{ env.release_tag }}
          files: ${{ env.zip_path }}
          body: "自动打包产物：${{ env.zip_label }}"

      # GitHub 上传资产时会把文件名中的非 ASCII 字符剥离（官方文档 Upload 端点行为），
      # 但更新资产（PATCH）接口不受限制。上传后先把资产名（即下载文件名）改回中文，
      # 显示名（label）同步设为同一中文名；若 GitHub 不保留中文名，则回退为仅设置中文显示名。
      # 同时清理本 Release 上其它含版本号的 zip 旧资产（历史残留、重复上传的 " (1)" 副本）
      - name: 设置资产中文名并清理旧资产
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          # 定位本次上传的资产；重复上传会被 GitHub 追加 " (1)" 后缀，先归一化再匹配
          asset_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$release_tag" --jq '.assets[] | [.id, .name] | @tsv' \
            | while IFS=$'\t' read -r id name; do
                norm=$(printf '%s' "$name" | sed -E 's/ \([0-9]+\)(\.[A-Za-z0-9]+)$/\1/')
                if [ "$norm" = "$zip_name" ]; then echo "$id"; fi
              done | sort -n | tail -1)
          if [ -z "$asset_id" ]; then
            echo "未找到资产 $zip_name，跳过中文名设置"
            exit 0
          fi
          patched=$(gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
            -f name="$zip_label" -f label="$zip_label" --jq '.name' 2>&1 || true)
          if [ "$patched" = "$zip_label" ]; then
            echo "资产名已恢复为中文，下载文件名将随之生效：$zip_label"
          else
            echo "警告：GitHub 未保留中文资产名（实际为：$patched），回退为仅设置中文显示名"
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" -f name="$zip_name" -f label="$zip_label" > /dev/null
          fi
          # 只保留本次资产：其余 zip 资产名里含当前版本号的一律视为旧产物清理
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$release_tag" --jq '.assets[] | [.id, .name] | @tsv' \
            | while IFS=$'\t' read -r id name; do
                if [ "$id" = "$asset_id" ]; then continue; fi
                case "$name" in
                  *.zip|*.ZIP)
                    case "$name" in
                      *"$release_tag"*)
                        gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id" && echo "已清理旧资产：$name"
                        ;;
                    esac
                    ;;
                esac
              done

      - name: Summary 输出下载入口
        run: |
          echo "📦 [前往 Release 页面下载](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ env.release_tag }})" >> "$GITHUB_STEP_SUMMARY"
