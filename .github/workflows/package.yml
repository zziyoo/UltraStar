name: 手动打包

on:
  workflow_dispatch:
    inputs:
      package_type:
        description: "打包类型"
        required: true
        type: choice
        default: "完整包"
        options:
          - 完整包
          - 增补包
      old_version:
        description: "增补包：旧版本 Tag；完整包忽略此项"
        required: false
        type: string
        default: "上一版"
      new_version:
        description: "增补包：新版本 Tag；完整包忽略此项"
        required: false
        type: string
        default: "最新版"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  package:
    name: 打包
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库（完整历史）
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 获取全部版本 Tag
        run: |
          git fetch --tags --force --prune
          echo "当前可用的版本 Tag："
          git tag --list 'v*' --sort=-v:refname | head -20

      - name: 安装 Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      # 版本校验全部由脚本完成，workflow 不维护 Tag 列表、不自修改：
      #   - 完整包 = 本次 checkout 的 main HEAD（git archive HEAD），版本号取 HEAD 的 info.json，
      #     与任何 Tag 无关，不要求 Tag 存在，不做 Tag↔info.json 校验
      #   - 增补包 = 旧 Tag → 新 Tag 正向差异："上一版"/"最新版" 由脚本按运行时 Tag 解析，
      #     指定 Tag 不存在 → 报错并列出有效 Tag；Tag 与其 info.json 版本不一致 → 拒绝打包；
      #     相同版本/反向版本 → 拒绝打包
      #   - zip 内容与预期集合逐文件比对；git archive 一律 -c core.autocrlf=false
      - name: 执行打包
        env:
          PKG_TYPE: ${{ inputs.package_type }}
          PKG_OLD: ${{ inputs.old_version }}
          PKG_NEW: ${{ inputs.new_version }}
        run: |
          node tools/package/package.mjs \
            --type "$PKG_TYPE" \
            --old "$PKG_OLD" \
            --new "$PKG_NEW" \
            --out-dir dist

      # Release 标识：完整包 = "v" + HEAD 的 info.json.version（Tag 不存在时由发布步骤在本次
      # 打包的 commit 上自动创建，仅作产物标识）；增补包 = 新版本 Tag（必须已存在）。
      # release_tag 由打包步骤在全部校验通过后写入 GITHUB_ENV，打包失败则后续步骤不执行
      - name: 发布到 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.release_tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.release_tag }}
          files: ${{ env.zip_path }}
          body: |
            自动打包产物：**${{ env.zip_label }}**

            中文文件名下载（GitHub Pages）：
            https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ env.zip_label }}

            （Pages 链接仅保留最近一次打包产物，历史版本请用下方的 Release 备用资产下载）

            因 GitHub 平台限制资产名仅支持英文，备用下载（下载后请手动改名）：${{ env.zip_name }}

      # Release 资产名无法含中文（GitHub 平台限制），中文文件名的压缩包改由 GitHub Pages 托管，
      # 部署产物即网站上可直接下载的文件，Release 正文已附带该中文下载链接
      - name: 生成中文名压缩包
        run: |
          owner="${GITHUB_REPOSITORY%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          echo "pages_base=https://${owner}.github.io/${repo}" >> "$GITHUB_ENV"
          rm -rf pages-src
          mkdir -p pages-src
          cp "${{ env.zip_path }}" "pages-src/${{ env.zip_label }}"

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-src

      - name: 部署到 GitHub Pages
        uses: actions/deploy-pages@v4

      # GitHub 会剥离资产名中的非 ASCII 字符（上传与 PATCH 更新均如此，2026-09-06 实测），
      # 资产名（即 Release 下载文件名）只能为英文；中文名通过 label 在页面展示，
      # 且由此前步骤部署到 GitHub Pages 的中文文件名压缩包作为正式下载入口。
      # 本步骤仍先尝试 PATCH 中文名：若 GitHub 未来放开限制则直接生效；否则自动回退为
      # 英文文件名 + 中文显示名，并清理本 Release 上其它含版本号的 zip 旧资产
      - name: 设置资产中文名并清理旧资产
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          # 定位本次上传的资产；重复上传会被 GitHub 追加 " (1)" 后缀，先归一化再匹配
          asset_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$release_tag" --jq '.assets[] | [.id, .name] | @tsv' \
            | while IFS=$'\t' read -r id name; do
                norm=$(printf '%s' "$name" | sed -E 's/ \([0-9]+\)(\.[A-Za-z0-9]+)$/\1/')
                if [ "$norm" = "$zip_name" ]; then echo "$id"; fi
              done | sort -n | tail -1)
          if [ -z "$asset_id" ]; then
            echo "未找到资产 $zip_name，跳过中文名设置"
            exit 0
          fi
          patched=$(gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
            -f name="$zip_label" -f label="$zip_label" --jq '.name' 2>&1 || true)
          if [ "$patched" = "$zip_label" ]; then
            echo "资产名已恢复为中文，下载文件名将随之生效：$zip_label"
            final_name="$zip_label"
          else
            echo "GitHub 不支持中文资产名（PATCH 后实际为：$patched），保持英文文件名 + 中文 label（页面显示名）"
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" -f name="$zip_name" -f label="$zip_label" > /dev/null
            final_name="$zip_name"
          fi
          {
            echo ""
            echo "### 资产命名结果"
            echo ""
            echo "- 页面显示名：$zip_label"
            echo "- 实际下载文件名：**$final_name**"
          } >> "$GITHUB_STEP_SUMMARY"
          # 只保留本次资产：其余 zip 资产名里含当前版本号的一律视为旧产物清理
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$release_tag" --jq '.assets[] | [.id, .name] | @tsv' \
            | while IFS=$'\t' read -r id name; do
                if [ "$id" = "$asset_id" ]; then continue; fi
                case "$name" in
                  *.zip|*.ZIP)
                    case "$name" in
                      *"$release_tag"*)
                        gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id" && echo "已清理旧资产：$name"
                        ;;
                    esac
                    ;;
                esac
              done

      - name: Summary 输出下载入口
        run: |
          echo "📦 [前往 Release 页面下载](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ env.release_tag }})" >> "$GITHUB_STEP_SUMMARY"
          echo "中文文件名下载（GitHub Pages）：[${{ env.zip_label }}](${{ env.pages_base }}/${{ env.zip_label }})" >> "$GITHUB_STEP_SUMMARY"
