name: 手动打包

on:
  workflow_dispatch:
    inputs:
      package_type:
        description: "打包类型"
        required: true
        type: choice
        default: "完整包"
        options:
          - 完整包
          - 增补包
      old_version:
        description: "增补包：旧版本 Tag（默认上一正式版本）；完整包忽略此项"
        required: false
        type: string
        default: "上一版"
      new_version:
        description: "增补包：新版本 Tag；默认使用当前 main 最新代码"
        required: false
        type: string
        default: "最新版"

permissions: {}

jobs:
  package:
    name: 打包与正式发布
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      zip_label: ${{ steps.metadata.outputs.zip_label }}
      release_url: ${{ steps.metadata.outputs.release_url }}
    steps:
      - name: 检出仓库（完整历史）
        uses: actions/checkout@v5
        with:
          # 手动运行可能从旧 Tag/旧提交进入 Actions 页面；打包始终以默认分支当前最新代码为准
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: 获取全部版本 Tag
        run: |
          git fetch --tags --force --prune
          echo "当前可用的版本 Tag："
          git tag --list 'v*' --sort=-v:refname | head -20

      - name: 安装 Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      # 版本校验全部由脚本完成，workflow 不维护 Tag 列表、不自修改：
      #   - 完整包 = 本次 checkout 的默认分支最新 HEAD（git archive HEAD），版本号取 HEAD 的 info.json，
      #     与任何 Tag 无关，不要求 Tag 存在，不做 Tag↔info.json 校验
      #   - 增补包 = 默认上一正式版本 Tag → 当前默认分支 HEAD 的正向差异；也支持显式指定新旧 Tag
      #     重新生成历史增补包；指定 Tag 不存在/版本不一致/非正向差异 → 拒绝打包
      #   - zip 内容与预期集合逐文件比对；git archive 一律 -c core.autocrlf=false
      - name: 执行打包
        env:
          PKG_TYPE: ${{ inputs.package_type }}
          PKG_OLD: ${{ inputs.old_version }}
          PKG_NEW: ${{ inputs.new_version }}
        run: |
          node tools/package/package.mjs \
            --type "$PKG_TYPE" \
            --old "$PKG_OLD" \
            --new "$PKG_NEW" \
            --out-dir dist

      # Release 标识：使用打包源代码的 info.json.version；增补包默认也会发布到该版本 Release。
      # release_tag 由打包步骤在全部校验通过后写入 GITHUB_ENV，打包失败则后续步骤不执行
      - name: 发布到 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.release_tag }}
          target_commitish: ${{ env.source_commit }}
          name: ${{ env.release_tag }}
          files: ${{ env.zip_path }}
      # Release 正文保持原有更新说明；下载入口由 Summary 提供。
      - name: 生成中文名压缩包
        run: |
          owner="${GITHUB_REPOSITORY%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          echo "pages_base=https://${owner}.github.io/${repo}" >> "$GITHUB_ENV"
          rm -rf pages-src
          mkdir -p pages-src
          cp "${{ env.zip_path }}" "pages-src/${{ env.zip_label }}"

      # GitHub 会剥离资产名中的非 ASCII 字符（上传与 PATCH 更新均如此，2026-09-06 实测），
      # 资产名（即 Release 下载文件名）只能为英文；中文名通过 label 在页面展示，
      # 中文文件名压缩包由后续 Pages Job 提供辅助下载。
      # 本步骤仍先尝试 PATCH 中文名：若 GitHub 未来放开限制则直接生效；否则自动回退为
      # 英文文件名 + 中文显示名，并清理本 Release 上其它含版本号的 zip 旧资产
      - name: 设置资产中文名并清理旧资产
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          # 定位本次上传的资产；重复上传会被 GitHub 追加 " (1)" 后缀，先归一化再匹配
          asset_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$release_tag" --jq '.assets[] | [.id, .name] | @tsv' \
            | while IFS=$'\t' read -r id name; do
                norm=$(printf '%s' "$name" | sed -E 's/ \([0-9]+\)(\.[A-Za-z0-9]+)$/\1/')
                if [ "$norm" = "$zip_name" ]; then echo "$id"; fi
              done | sort -n | tail -1)
          if [ -z "$asset_id" ]; then
            echo "::error::未找到上传资产 $zip_name"
            exit 1
          fi
          patched=$(gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
            -f name="$zip_label" -f label="$zip_label" --jq '.name' 2>&1 || true)
          if [ "$patched" = "$zip_label" ]; then
            echo "资产名已恢复为中文，下载文件名将随之生效：$zip_label"
            final_name="$zip_label"
          else
            echo "GitHub 不支持中文资产名（PATCH 后实际为：$patched），保持英文文件名 + 中文 label（页面显示名）"
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" -f name="$zip_name" -f label="$zip_label" > /dev/null
            final_name="$zip_name"
          fi
          echo "final_name=$final_name" >> "$GITHUB_ENV"
          {
            echo ""
            echo "### 资产命名结果"
            echo ""
            echo "- 页面显示名：$zip_label"
            echo "- 实际下载文件名：**$final_name**"
          } >> "$GITHUB_STEP_SUMMARY"
          # 只保留本次资产：其余 zip 资产名里含当前版本号的一律视为旧产物清理
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$release_tag" --jq '.assets[] | [.id, .name] | @tsv' \
            | while IFS=$'\t' read -r id name; do
                if [ "$id" = "$asset_id" ]; then continue; fi
                case "$name" in
                  *.zip|*.ZIP)
                    case "$name" in
                      *"$release_tag"*)
                        gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id" && echo "已清理旧资产：$name"
                        ;;
                    esac
                    ;;
                esac
              done

      - name: 发布元数据与下载入口
        id: metadata
        if: ${{ always() }}
        run: |
          release_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/${release_tag:-未知}"
          {
            echo "release_tag=${release_tag:-}"
            echo "zip_label=${zip_label:-}"
            echo "release_url=$release_url"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## 打包与正式发布"
            echo "- 版本：${release_tag:-未生成}"
            echo "- 打包类型：$PKG_TYPE"
            echo "- 源码 Commit：${source_commit:-未生成}"
            echo "- ZIP：${zip_name:-未生成}"
            if [ -n "${zip_path:-}" ] && [ -f "$zip_path" ]; then echo "- 文件大小：$(stat -c %s "$zip_path") bytes"; else echo "- 文件大小：未知"; fi
            echo "- 资产中文显示名：${zip_label:-未知}"
            echo "- 实际下载文件名：${final_name:-未知（请检查资产处理日志）}"
            echo "- [Release 页面与备用下载入口]($release_url)"
            echo "- 打包或发布失败时请检查上方步骤；Pages 部署结果另见部署 Job。"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          PKG_TYPE: ${{ inputs.package_type }}

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          path: pages-src

  pages:
    name: Pages 辅助下载部署
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 配置 GitHub Pages
        id: configure
        uses: actions/configure-pages@v6

      - name: 检查 Pages artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' > "$RUNNER_TEMP/pages-artifacts"
          count=$(wc -l < "$RUNNER_TEMP/pages-artifacts")
          if [ "$count" -ne 1 ]; then
            echo "::error::需要恰好一个未过期的 github-pages artifact，找到 $count 个；请检查上传步骤。"
            exit 1
          fi
          echo "找到 Pages artifact ID：$(cat "$RUNNER_TEMP/pages-artifacts")"

      - name: 部署到 GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
          timeout: 900000

      - name: Pages 部署报告
        if: ${{ always() }}
        env:
          CONFIGURE_RESULT: ${{ steps.configure.outcome }}
          ARTIFACT_RESULT: ${{ steps.artifact.outcome }}
          DEPLOY_RESULT: ${{ steps.deploy.outcome }}
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
          ZIP_LABEL: ${{ needs.package.outputs.zip_label }}
          RELEASE_TAG: ${{ needs.package.outputs.release_tag }}
          RELEASE_URL: ${{ needs.package.outputs.release_url }}
        run: |
          {
            echo "## Pages 辅助下载部署"
            echo "- 版本：$RELEASE_TAG"
            if [ "$DEPLOY_RESULT" = success ]; then
              echo "- 部署成功：[中文文件名下载](${PAGE_URL%/}/$ZIP_LABEL)"
            else
              echo "- Pages 部署未成功（配置：$CONFIGURE_RESULT；artifact 检查：$ARTIFACT_RESULT；部署：$DEPLOY_RESULT）。"
              echo "- 请查看对应步骤的完整日志，区分取消、权限错误、artifact 缺失、网络或服务错误及超时。部署状态长期为空并以 Timeout 结束时，表示等待状态超时，具体原因仍需调查。"
              echo "- Pages 可能仍指向旧版本。正式 Release 已发布：[备用下载]($RELEASE_URL)。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
