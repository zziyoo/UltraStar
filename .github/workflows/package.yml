name: 手动打包

on:
  workflow_dispatch:
    inputs:
      package_type:
        description: "打包类型"
        required: true
        type: choice
        default: "完整包"
        options:
          - 完整包
          - 增补包
      version:
        description: "完整包：选择版本（默认最新版）"
        required: true
        type: choice
        default: "最新版"
        options:
          - 最新版
          - v2.1.0
          - v1.9.9
      old_version:
        description: "增补包：旧版本（默认上一版）"
        required: true
        type: choice
        default: "上一版"
        options:
          - 上一版
          - v2.1.0
          - v1.9.9
      new_version:
        description: "增补包：新版本（默认最新版）"
        required: true
        type: choice
        default: "最新版"
        options:
          - 最新版
          - v2.1.0
          - v1.9.9

permissions:
  contents: write

jobs:
  package:
    name: 打包
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库（完整历史）
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 获取全部版本 Tag
        run: |
          git fetch --tags --force --prune
          echo "当前可用的版本 Tag："
          git tag --list 'v*' --sort=-v:refname | head -20

      - name: 安装 Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      # 打包脚本内部完成：版本解析与校验（相同版本/反向版本直接报错终止）、
      # git diff 计算增补文件、zip 内容与预期集合的逐文件比对、Summary 输出
      - name: 执行打包
        env:
          PKG_TYPE: ${{ inputs.package_type }}
          PKG_VERSION: ${{ inputs.version }}
          PKG_OLD: ${{ inputs.old_version }}
          PKG_NEW: ${{ inputs.new_version }}
        run: |
          node tools/package/package.mjs \
            --type "$PKG_TYPE" \
            --version "$PKG_VERSION" \
            --old "$PKG_OLD" \
            --new "$PKG_NEW" \
            --out-dir dist

      # 用当前 Tag 列表刷新本 workflow 的版本下拉选项（无变化时自动跳过）
      - name: 刷新版本下拉选项
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node tools/package/refresh-choices.mjs

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.release_tag }}
          name: ${{ env.release_tag }}
          files: ${{ env.zip_path }}
          body: "自动打包产物：${{ env.zip_name }}"

      - name: Summary 输出下载入口
        run: |
          echo "📦 [前往 Release 页面下载](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ env.release_tag }})" >> "$GITHUB_STEP_SUMMARY"
