name: Rogue temporary verification
on:
  push:
    branches:
      - codex/rogue-refresh-curio-balance
permissions:
  contents: read
jobs:
  rogue-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Data test
        id: data
        continue-on-error: true
        run: node tools/test/rogue-data.test.mjs
      - name: Logic test
        id: logic
        continue-on-error: true
        run: node tools/test/rogue.test.mjs
      - name: Mode smoke test
        id: smoke
        continue-on-error: true
        run: node tools/test/rogue-mode-smoke.mjs
      - name: Final result
        if: always()
        run: |
          echo 'data: ${{ steps.data.outcome }}'
          echo 'logic: ${{ steps.logic.outcome }}'
          echo 'smoke: ${{ steps.smoke.outcome }}'
          test '${{ steps.data.outcome }}' = success
          test '${{ steps.logic.outcome }}' = success
          test '${{ steps.smoke.outcome }}' = success
